name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior (salvo en main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      # next build también corre el chequeo de tipos de todo el proyecto (tests incluidos)
      - run: bun run build
