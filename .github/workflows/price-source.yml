name: Price source
# Loads live prices from Alfa Beta (scripts/check-prices.ts) and fails if any
# ingredient has none, so a source that stops working shows up as a failed run
# instead of an empty /precios page.
on:
  pull_request:
    paths:
      - lib/medications/alfabeta.ts
      - lib/medications/server.ts
      - scripts/check-prices.ts
      - .github/workflows/price-source.yml
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check-prices
